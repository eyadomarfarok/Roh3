<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>احتفالية روح مصطفى رواش</title>
    <style>
        :root {
            --primary: #2d5a27;
            --accent: #d4af37;
            --bg: #fffcf2;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            font-family: 'Amiri', serif;
            overflow-x: hidden;
        }

        /* شاشة البداية */
        .welcome-screen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('IMG-20260513-WA0045.jpg');
            background-size: cover;
            background-position: center;
            color: white;
            transition: 1s;
            text-align: center;
        }

        .welcome-screen h1 {
            font-size: 2.8rem;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            margin-bottom: 10px;
            animation: fadeInDown 1.5s;
        }

        .poetry {
            font-style: italic;
            font-size: 1.4rem;
            color: var(--accent);
            margin-bottom: 30px;
            max-width: 80%;
            line-height: 1.6;
        }

        .start-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            background: var(--accent);
            color: black;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        .start-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.6);
        }

        /* معرض الصور */
        .main-content {
            display: none;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 50px;
        }

        .photo-card {
            background: white;
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: 0.5s;
            cursor: pointer;
        }

        .photo-card:hover {
            transform: translateY(-15px) rotate(2deg);
        }

        .photo-card img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 10px;
        }

        .photo-label {
            text-align: center;
            padding: 15px;
            font-weight: bold;
            color: var(--primary);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-out { opacity: 0; pointer-events: none; }

        .flower {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            animation: fall 4s linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="welcome-screen" id="welcome">
        <h1>عقيقة الغالية روح ✨</h1>
        <div class="poetry">
            "يا رُوحُ أنتِ مِنَ الرَّحمنِ هديّةٌ <br>
            نَارَتْ بِها أرجاءُ دنيانا جَمالاً"
        </div>
        <button class="start-btn" onclick="openInvitation()">اكتشف تفاصيل الفرحة</button>
    </div>

    <div class="main-content" id="content">
        <h2 style="text-align: center; color: var(--primary); font-size: 2.2rem;">ننتظركم في ليلة تملؤها المحبة</h2>
        
        <div class="gallery">
            <div class="photo-card">
                <img src="IMG-20260513-WA0044.jpg" alt="روح 1">
                <div class="photo-label">يوم الجميلة المنتظر 🌸</div>
            </div>

            <div class="photo-card">
                <img src="IMG-20260513-WA0043.jpg" alt="روح 2">
                <div class="photo-label">تفاصيل اللقاء السعيد ✉️</div>
            </div>

            <div class="photo-card">
                <img src="IMG-20260513-WA0045.jpg" alt="روح 3">
                <div class="photo-label">اللهم بارك واحفظ 🤲</div>
            </div>
        </div>

        <div style="text-align: center; margin-top: 50px; padding-bottom: 50px;">
            <button class="start-btn" onclick="confirmAttendance()">تأكيد الحضور عبر واتساب ✅</button>
        </div>
    </div>

    <script>
        function openInvitation() {
            const welcome = document.getElementById('welcome');
            const content = document.getElementById('content');
            welcome.classList.add('fade-out');
            setTimeout(() => {
                welcome.style.display = 'none';
                content.style.display = 'block';
                setInterval(createFlower, 300);
            }, 1000);
        }

        function createFlower() {
            const symbols = ['🌸', '✨', '🤍', '⭐'];
            const flower = document.createElement('div');
            flower.className = 'flower';
            flower.style.left = Math.random() * 100 + 'vw';
            flower.style.fontSize = Math.random() * 20 + 10 + 'px';
            flower.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            document.body.appendChild(flower);
            setTimeout(() => flower.remove(), 4000);
        }

        function confirmAttendance() {
            // الرقم الخاص بك مع رسالة مخصصة
            const phone = "201067077398";
            const message = "بإذن الله، يشرفني حضور عقيقة الغالية روح.. ألف مبارك!";
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
        }
    </script>
</body>
</html>
